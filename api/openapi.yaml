openapi: 3.0.3
info:
  title: Film Manager API
  description: REST APIs for the Film Manager platform (session-based authentication).
  version: 1.0.0
servers:
  - url: http://localhost:3001
tags:
  - name: auth
  - name: films
  - name: public
  - name: reviews
  - name: admin
paths:
  /api/sessions:
    post:
      tags:
        - auth
      summary: Login with email and password
      operationId: apiSessionsPOST
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api_sessions_body"
        required: true
      responses:
        "200":
          description: Authenticated; cookie connect.sid is set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-swagger-router-controller: Auth
  /api/sessions/current:
    get:
      tags:
        - auth
      summary: Get current authenticated user
      operationId: apiSessionsCurrentGET
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - sessionAuth: []
      x-swagger-router-controller: Auth
    delete:
      tags:
        - auth
      summary: Logout and destroy session
      operationId: apiSessionsCurrentDELETE
      responses:
        "204":
          description: Logged out
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - sessionAuth: []
      x-swagger-router-controller: Auth
  /api/films/public:
    get:
      tags:
        - public
      summary: List public films (paginated)
      operationId: apiFilmsPublicGET
      parameters:
        - name: page
          in: query
          description: 1-based page index
          required: false
          style: form
          explode: true
          schema:
            minimum: 1
            type: integer
            default: 1
        - name: pageSize
          in: query
          description: Items per page
          required: false
          style: form
          explode: true
          schema:
            maximum: 100
            minimum: 1
            type: integer
      responses:
        "200":
          description: Page of public films
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedFilms"
      x-swagger-router-controller: Public
  /api/films/public/{filmId}:
    get:
      tags:
        - public
      summary: Get a single public film
      operationId: apiFilmsPublicFilmIdGET
      parameters:
        - name: filmId
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: integer
      responses:
        "200":
          description: A public film
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilmPublic"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-swagger-router-controller: Public
  /api/films/public/{filmId}/reviews:
    get:
      tags:
        - public
        - reviews
      summary: List reviews of a public film
      operationId: apiFilmsPublicFilmIdReviewsGET
      parameters:
        - name: filmId
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: integer
      responses:
        "200":
          description: Reviews for film
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReviewCompletedOrPending"
                x-content-type: application/json
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-swagger-router-controller: Public
  /api/films/public/{filmId}/reviews/{reviewerId}:
    get:
      tags:
        - public
        - reviews
      summary: Get a single review of a public film
      operationId: apiFilmsPublicFilmIdReviewsReviewerIdGET
      parameters:
        - name: filmId
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: integer
        - name: reviewerId
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: integer
      responses:
        "200":
          description: Review invitation or completed review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewCompletedOrPending"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-swagger-router-controller: Public
  /api/films/me:
    get:
      tags:
        - films
      summary: List films owned by current user (paginated)
      operationId: apiFilmsMeGET
      parameters:
        - name: page
          in: query
          description: 1-based page index
          required: false
          style: form
          explode: true
          schema:
            minimum: 1
            type: integer
            default: 1
        - name: pageSize
          in: query
          description: Items per page
          required: false
          style: form
          explode: true
          schema:
            maximum: 100
            minimum: 1
            type: integer
      responses:
        "200":
          description: Page of my films
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedFilms"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - sessionAuth: []
      x-swagger-router-controller: Films
  /api/films/reviews/me:
    get:
      tags:
        - films
        - reviews
      summary: List films I am invited to review
      operationId: apiFilmsReviewsMeGET
      responses:
        "200":
          description: Films for which the user is a reviewer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Film"
                x-content-type: application/json
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - sessionAuth: []
      x-swagger-router-controller: Films
  /api/films:
    post:
      tags:
        - films
      summary: Create a new film (owner becomes current user)
      operationId: apiFilmsPOST
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Film"
        required: true
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: Resource URL of the created film
              style: simple
              explode: false
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Film"
        "400":
          description: Validation or input error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "Conflict (e.g., duplicate)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - sessionAuth: []
      x-swagger-router-controller: Films
  /api/films/{filmId}:
    get:
      tags:
        - films
      summary: Get a film if public or I am the owner
      operationId: apiFilmsFilmIdGET
      parameters:
        - name: filmId
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: integer
      responses:
        "200":
          description: Film
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Film"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - sessionAuth: []
      x-swagger-router-controller: Films
    put:
      tags:
        - films
      summary: Update a film (owner only). Visibility cannot be toggled.
      operationId: apiFilmsFilmIdPUT
      parameters:
        - name: filmId
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Film"
        required: true
      responses:
        "200":
          description: Updated film
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Film"
        "400":
          description: Validation or input error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - sessionAuth: []
      x-swagger-router-controller: Films
    delete:
      tags:
        - films
      summary: Delete a film (owner only)
      operationId: apiFilmsFilmIdDELETE
      parameters:
        - name: filmId
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - sessionAuth: []
      x-swagger-router-controller: Films
  /api/films/{filmId}/reviews:
    post:
      tags:
        - reviews
      summary: Owner invites a reviewer for a public film
      operationId: apiFilmsFilmIdReviewsPOST
      parameters:
        - name: filmId
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/filmId_reviews_body"
        required: true
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewCompletedOrPending"
        "400":
          description: Validation or input error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - sessionAuth: []
      x-swagger-router-controller: Reviews
  /api/films/{filmId}/reviews/{reviewerId}:
    put:
      tags:
        - reviews
      summary: Invited reviewer marks review as completed (and sets details)
      operationId: apiFilmsFilmIdReviewsReviewerIdPUT
      parameters:
        - name: filmId
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: integer
        - name: reviewerId
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewCompleted"
        required: true
      responses:
        "200":
          description: Review updated to completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewCompleted"
        "400":
          description: Validation or input error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - sessionAuth: []
      x-swagger-router-controller: Reviews
    delete:
      tags:
        - reviews
      summary: Owner removes an invitation if not completed
      operationId: apiFilmsFilmIdReviewsReviewerIdDELETE
      parameters:
        - name: filmId
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: integer
        - name: reviewerId
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: integer
      responses:
        "204":
          description: Invitation removed
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - sessionAuth: []
      x-swagger-router-controller: Reviews
  /api/reviews/auto-assign:
    post:
      tags:
        - admin
        - reviews
      summary: Auto-assign invitations evenly for films without invitations
      operationId: apiReviewsAuto_assignPOST
      responses:
        "200":
          description: Summary of created invitations
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: integer
                example:
                  "42":
                    - 3
                    - 5
                x-content-type: application/json
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - sessionAuth: []
      x-swagger-router-controller: Admin
components:
  schemas:
    User:
      required:
        - email
        - id
      type: object
      properties:
        id:
          type: integer
        name:
          minLength: 1
          type: string
        email:
          type: string
          format: email
        password:
          maxLength: 20
          minLength: 6
          type: string
        links:
          $ref: "#/components/schemas/User_links"
      additionalProperties: false
      example:
        password: password
        name: name
        links:
          self: http://example.com/aeiou
        id: 0
        email: ""
    FilmBase:
      required:
        - id
        - owner
        - private
        - title
      type: object
      properties:
        id:
          type: integer
        title:
          minLength: 1
          type: string
        owner:
          type: integer
        private:
          type: boolean
        watchDate:
          type: string
          format: date
        rating:
          maximum: 10
          minimum: 0
          type: integer
        favorite:
          type: boolean
          default: false
        links:
          $ref: "#/components/schemas/FilmBase_links"
      additionalProperties: false
    FilmPrivate:
      allOf:
        - $ref: "#/components/schemas/FilmBase"
        - type: object
          properties:
            private:
              type: boolean
              enum:
                - true
    FilmPublic:
      allOf:
        - $ref: "#/components/schemas/FilmBase"
        - type: object
          not:
            anyOf:
              - required:
                  - watchDate
              - required:
                  - rating
              - required:
                  - favorite
          properties:
            private:
              type: boolean
              enum:
                - false
    Film:
      oneOf:
        - $ref: "#/components/schemas/FilmPrivate"
        - $ref: "#/components/schemas/FilmPublic"
    ReviewBase:
      required:
        - completed
        - filmId
        - reviewerId
      type: object
      properties:
        filmId:
          type: integer
        reviewerId:
          type: integer
        completed:
          type: boolean
        reviewDate:
          type: string
          format: date
        rating:
          maximum: 10
          minimum: 0
          type: integer
        review:
          maxLength: 1000
          type: string
        links:
          $ref: "#/components/schemas/ReviewBase_links"
      additionalProperties: false
    ReviewCompleted:
      allOf:
        - $ref: "#/components/schemas/ReviewBase"
        - required:
            - rating
            - review
            - reviewDate
          type: object
          properties:
            completed:
              type: boolean
              enum:
                - true
    ReviewPending:
      allOf:
        - $ref: "#/components/schemas/ReviewBase"
        - type: object
          not:
            anyOf:
              - required:
                  - reviewDate
              - required:
                  - rating
              - required:
                  - review
          properties:
            completed:
              type: boolean
              enum:
                - false
    ReviewCompletedOrPending:
      oneOf:
        - $ref: "#/components/schemas/ReviewCompleted"
        - $ref: "#/components/schemas/ReviewPending"
    PaginatedFilms:
      required:
        - items
        - links
        - page
        - pageSize
        - totalItems
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Film"
        page:
          minimum: 1
          type: integer
        pageSize:
          minimum: 1
          type: integer
        totalItems:
          minimum: 0
          type: integer
        links:
          $ref: "#/components/schemas/PaginatedFilms_links"
      example:
        totalItems: 0
        pageSize: 1
        links:
          next: http://example.com/aeiou
          last: http://example.com/aeiou
          prev: http://example.com/aeiou
          self: http://example.com/aeiou
          first: http://example.com/aeiou
        page: 1
        items:
          - ""
          - ""
    Error:
      type: object
      properties:
        error:
          type: string
        details:
          type: array
          items:
            type: string
    api_sessions_body:
      required:
        - email
        - password
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          maxLength: 20
          minLength: 6
          type: string
    filmId_reviews_body:
      required:
        - reviewerId
      type: object
      properties:
        reviewerId:
          type: integer
    User_links:
      type: object
      properties:
        self:
          type: string
          format: uri
      example:
        self: http://example.com/aeiou
    FilmBase_links:
      type: object
      properties:
        self:
          type: string
          format: uri
        owner:
          type: string
          format: uri
        reviews:
          type: string
          format: uri
    ReviewBase_links:
      type: object
      properties:
        self:
          type: string
          format: uri
        film:
          type: string
          format: uri
        reviewer:
          type: string
          format: uri
    PaginatedFilms_links:
      type: object
      properties:
        self:
          type: string
          format: uri
        first:
          type: string
          format: uri
        prev:
          type: string
          format: uri
          nullable: true
        next:
          type: string
          format: uri
          nullable: true
        last:
          type: string
          format: uri
      example:
        next: http://example.com/aeiou
        last: http://example.com/aeiou
        prev: http://example.com/aeiou
        self: http://example.com/aeiou
        first: http://example.com/aeiou
  responses:
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Not allowed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Validation or input error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: "Conflict (e.g., duplicate)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  parameters:
    Page:
      name: page
      in: query
      description: 1-based page index
      required: false
      style: form
      explode: true
      schema:
        minimum: 1
        type: integer
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: Items per page
      required: false
      style: form
      explode: true
      schema:
        maximum: 100
        minimum: 1
        type: integer
    FilmId:
      name: filmId
      in: path
      required: true
      style: simple
      explode: false
      schema:
        type: integer
    ReviewerId:
      name: reviewerId
      in: path
      required: true
      style: simple
      explode: false
      schema:
        type: integer
  securitySchemes:
    sessionAuth:
      type: apiKey
      name: connect.sid
      in: cookie
